AWSTemplateFormatVersion: '2010-09-09'
Description: Demo stack for test and prod pipeline
Parameters:
  Environment:
    Type: String
    AllowedValues: [test, prod]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Mappings:
  InstanceConfig:
    test:
      InstanceType: t3.micro
    prod:
      InstanceType: t3.small

Resources:
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !FindInMap [InstanceConfig, !Ref Environment, InstanceType]
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !GetAtt WebSG.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd
          echo "<body style='background-color:#1e90ff;color:white'><h1>This is the ${Environment} environment</h1></body>" > /var/www/html/index.html
          systemctl enable --now httpd
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-Server"

  ServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref AppServer

Outputs:
  ServerIP:
    Value: !Ref ServerEIP
  WebsiteURL:
    Value: !Sub "http://${ServerEIP}"
